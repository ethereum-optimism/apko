name: ci

on:
  pull_request:
    branches:
      - op
  push:
    branches:
      - op

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install erofs-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils
          command -v fsck.erofs

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          SOURCE_DATE_EPOCH="$(awk 'BEGIN { now = systime(); srand(now); print 1 + int(rand() * now) }')"
          export SOURCE_DATE_EPOCH
          go test -race ./...

  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4
        with:
          install_args: goreleaser-pro
          cache: false

      - name: Check GoReleaser config
        run: goreleaser check
